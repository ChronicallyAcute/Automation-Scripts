name: gallery_py_qt tests

on:
  push:
    paths:
      - 'gallery_py_qt/**'
      - 'tests/**'
      - 'pytest.ini'
      - '.github/workflows/gallery-tests.yml'
  pull_request:
    paths:
      - 'gallery_py_qt/**'
      - 'tests/**'
      - 'pytest.ini'
      - '.github/workflows/gallery-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # System libraries PySide6/Qt needs to import under offscreen.
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libpulse0 libfontconfig1 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gallery_py_qt/requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q
